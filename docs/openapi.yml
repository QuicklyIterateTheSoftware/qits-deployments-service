        \ own variables, then the extras env, then the settings rows (a setting wins\
        \ over an extras key of the same name). added/removed/changed compare the\
        \ two sides; kept lists live keys the next deployment does not state but an\
        \ update never removes (the deployer's own variables and QITS_RESOURCE_*),\
        \ so removed is exactly what an update would --env-rm. A value is null on\
        \ both sides when the key is a secret setting or its name contains SECRET,\
        \ TOKEN, PASSWORD or CREDENTIAL, or ends with _AUTH. A service that is not\
        \ running makes everything added."
      operationId: previewSettings
      parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
      - name: environment
        in: path
        required: true
        schema:
          type: string
      - name: extras
        in: query
        schema:
          type: string
      responses:
        "200":
          description: The difference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdSettingsPreviewDto"
        "400":
          description: "A name is invalid, or extras is neither include nor exclude"
        "404":
          description: "No such environment, or an application the deployer does not\
            \ know"
        "502":
          description: extras=include and the application's deployment config cannot
            be read
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Pd Setting Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:system
        - qits:agent
  /deployments/api/settings/{application}/{environment}/{key}:
    put:
      summary: "Insert or replace one setting; answers the stored row, its value null\
        \ if secret"
      operationId: putSetting
      parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
      - name: environment
        in: path
        required: true
        schema:
          type: string
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutSettingRequest"
        required: true
      responses:
        "200":
          description: The stored setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdSettingDto"
        "400":
          description: "The key is not an environment variable name, a name is invalid,\
            \ or no value"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Pd Setting Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
    delete:
      summary: Remove one setting
      operationId: deleteSetting
      parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
      - name: environment
        in: path
        required: true
        schema:
          type: string
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Removed
        "400":
          description: The key or a name is invalid
        "404":
          description: No such setting
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Pd Setting Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
