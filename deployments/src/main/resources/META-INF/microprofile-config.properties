# The execution defaults, shipped from this library jar. Library jars ship defaults as
# META-INF/microprofile-config.properties (ordinal 100) — a jar's application.properties is ignored
# — read by whichever app pulls the jar in. The consuming app / env overrides any of these.
#
# The datasource, the persistence unit and the Flyway lineage are NOT here. This component is one
# database, so they are declared once, in the environments jar — two files at ordinal 100 naming the
# same key would make the winner arbitrary. What is here is everything that executes.
#
# The whole namespace is `qits.deployments.*`. It was `qits.cd.*` in the ancestor, `qits.pd.*` for
# one release, and `qits.platform.deployments.*` until the retired tier modifier was dropped.
#
# EVERY KEY IS READ TWICE, AND THAT IS NOT OPTIONAL. In env form the new spelling would be
# QITS_DEPLOYMENTS_*, but what a live deployment injects is still QITS_PLATFORM_DEPLOYMENTS_* —
# nothing that feeds these keys is released by this repository, so the two cannot move together.
# Each line therefore defaults to the OLD variable, and the env source outranks properties, so a
# deployment stating the new name wins and one still stating the old feeds it.
#
# THE CLAIM ABOVE THAT AN OLD SPELLING FAILS LOUDLY AT BOOT WAS WRONG, and it cost the estate an
# afternoon. An @ConfigProperty read as Optional<String> is satisfied by ABSENCE, so a key whose
# bridging line was missing did not fail anything — it silently became unset. Two were missing after
# the rename (postgres.admin-password, extras-url) and the symptoms were a provisioning error naming
# a key nobody had touched, and an authoritative config service quietly ceasing to be consulted.
# A new key here needs its line even when it ships no default of its own; see both of those below.

# The docker-compatible CLI this component shells out to. Pointing it at anything else (podman)
# makes supplying that CLI the deployment's problem — the docker vocabulary here is container
# lifecycle only (pull, run, inspect, logs, rm, ps, network create/inspect/rm; never exec, never
# build).
qits.deployments.container-runtime=${QITS_PLATFORM_DEPLOYMENTS_CONTAINER_RUNTIME:docker}

# --- the platform's domain -------------------------------------------------------------------
#
# THE DOMAIN IS ONE FACT AND IS STATED ONCE. It used to be fanned out by the bootstrap into five
# per-service composed spellings — QITS_EDGE_ACME_DOMAIN, QITS_IDP_BROWSER_SSO_COOKIE_DOMAIN, two
# *_BROWSER_HOSTS, QITS_IDP_WEBAUTHN_ORIGINS, QITS_IDP_BROWSER_SSO_CANONICAL_ORIGIN — each able to
# go stale on its own, and the edge's copy and the idp's DID diverge, which broke sign-in on the
# live platform. So the domain is stated here and propagated to every container exactly as
# QITS_ENVIRONMENT is (SwarmDeploymentDriver.DOMAIN_VARIABLE); a service derives its own names from
# it and no service carries a hostname in its configuration.
#
# The variable it reads is the bare QITS_DOMAIN and not a QITS_PLATFORM_DEPLOYMENTS_* spelling,
# because it is not this component's setting: it is the platform's one domain, which this component
# happens to be the thing that hands out. The deployer receives it under the same name it writes.
#
# THERE IS NO DEFAULT, AND THAT IS THE POINT. No value this repository could ship would be right for
# more than one installation, and a hostname baked in here would be the sixth stale copy of exactly
# the fact this change exists to state once. The domain is stated by CONFIGURATION and propagated
# from here; an installation that has not stated it gets NO VARIABLE rather than a wrong one, and
# each service falls back to whatever default it ships.
#
# The empty default keeps the no-default rule intact rather than weakening it, the same way
# postgres.admin-password and extras-url do: SmallRye reads an empty value as ABSENT, the field is
# Optional<String>, and the driver already treats blank as absent — so with neither this nor
# QITS_DOMAIN set, every argv is byte for byte what it was before this key existed.
qits.deployments.platform-domain=${QITS_DOMAIN:}

# --- which orchestrator runs the deployed services --------------------------------------------
#
# `swarm`, and nothing else: the same daemon, one node, but the SERVICE is the identity. A replace
# is `docker service update --image` in place, the cutover and the rollback are the orchestrator's
# (--update-order / --update-monitor / --update-failure-action), and a task does not enter DNS
# until its healthcheck passes. What this component still does is classify a missing image, record
# the rows and announce them. Swarm is also what deploys THIS COMPONENT ITSELF: a self-update
# needs a third party — neither instance can arbitrate its own succession — and swarm has one in
# the daemon.
#
# THE KEY IS A GUARD NOW, not a choice. The by-hand docker replace it used to select is deleted, so
# there is one implementation and nothing to pick; what is left is the refusal. A deployment still
# carrying `docker` from before the migration names an orchestrator this build does not have, and
# failing its boot naming the key is a far better answer than deploying the platform with whatever
# is left. Any value but `swarm` fails the boot.
qits.deployments.orchestrator=${QITS_PLATFORM_DEPLOYMENTS_ORCHESTRATOR:swarm}

# --- the deployment spec -------------------------------------------------------------------------
#
# Where a repository's .config/qits/deployments.yml is read from, at the sha a build announced:
#   GET <git-host-url>/git/<projectId>/<repoName>/blob/<sha>/.config/qits/deployments.yml
#   GET <git-host-url>/git/<repoId>/blob/<sha>/.config/qits/deployments.yml
# The same blob contract qits-ci reads a pipeline definition through, and the same default address.
# The first is the public, name-addressed form and is what a build event carries; the second is the
# git host's internal storage scheme and is the fallback for an announcement with no name pair.
#
# THE DEFAULT IS THE GIT HOST, and it was WRONG for several releases: it named
# http://qits-platform-artifacts:8080/artifacts, the address the byte plane answered on before the
# git host was split out of it, so every deployment on a platform that did not override the key
# read its spec from a service that has not served /git since. Deployments do override it — the
# live wiring is QITS_PLATFORM_DEPLOYMENTS_GIT_HOST_URL=http://<env>-qits-githost:8080 — which is
# why the wrong default cost nothing and hid this long. The shipped value carries no environment
# prefix, like every other address here (quarkus.oidc.auth-server-url, qits.observability.url): a
# prefixed hostname is a deployment fact, and the sibling qits-ci ships the same bare default.
#
# THIS IS THE COMPONENT'S ONE OUTBOUND HTTP CALL. It used to be two: the topology lived in
# qits-serviceregistry and every registration and every resolution was a request. The merge made
# that a repository query, and this is what is left.
#
# A 404 is an answer: no file means every default, and every repository without one deploys exactly
# as it did before the file existed. Any other failure — refused connection, 500, timeout, a file
# that does not parse — FAILS the deployment with the cause in its detail. A topology is never
# guessed; a guess puts a container on the wrong networks under the wrong name.
#
# THE DEFAULT DERIVES THE ALIAS AND DOES NOT NAME IT. The bare `http://qits-githost:8080` this
# replaced was a plane-era address and resolves nowhere now: every wire alias is
# `<env>-<application>`, and QITS_ENVIRONMENT is injected into every container this component
# starts — including its own. So the fallback is an expression over it rather than a peer a
# deployment has to keep correcting, and a deployment that stops setting the variable lands on a
# working address instead of a dead one. The env spelling still wins where it is set.
qits.deployments.git-host-url=${QITS_PLATFORM_DEPLOYMENTS_GIT_HOST_URL:http://${QITS_ENVIRONMENT:dev}-qits-githost:8080}
qits.deployments.git-host-timeout-seconds=${QITS_PLATFORM_DEPLOYMENTS_GIT_HOST_TIMEOUT_SECONDS:10}

# --- provisioning the platform's postgres ---------------------------------------------------------
#
# What a repository declares in `resources:` is created here before its container starts: a login
# role and a database of its own, on the postgres of its tier (qits-oci-postgresql, at the wire
# alias its own naming rule produces — no address is configured, because it is derived exactly like
# every other address on the platform).
#
# THE ADMIN CREDENTIAL IS DEPLOYMENT CONFIG AND NOTHING ELSE, which is the same rule the extras
# follow: the trust domain that already holds the docker socket is the one allowed to hand this
# process a superuser. It is never stored in a row and never reaches an argv — a provisioned
# application receives its OWN credential, generated here, and nothing more.
#
# admin-password is deliberately WITHOUT A DEFAULT. No value this repository could ship would be
# right, and a wrong one fails at the first CREATE ROLE with an authentication error that reads like
# anything but "nothing configured this". Unset, a deployment that declares a resource fails naming
# this key — the one actionable sentence there is. A deployment that declares none never reads it.
#
# IT STILL NEEDS THE BRIDGING LINE, AND LEAVING IT OUT BROKE THE ESTATE. The namespace rename moved
# the property to qits.deployments.*, whose env form is QITS_DEPLOYMENTS_POSTGRES_ADMIN_PASSWORD —
# but what the deployment injects is the OLD spelling, QITS_PLATFORM_DEPLOYMENTS_*. The other 26
# keys bridge that gap with a default naming the old variable; this one had no line at all, because
# "no default" was read as "no declaration". So from the moment the renamed deployer went live
# (2026.925.93750, 09:37) EVERY deployment declaring a resource failed provisioning — measured:
# events, idp, maintenance, mirror, orchestrator and ci, six in a row, each rolled back.
#
# The empty default keeps the no-default RULE intact rather than weakening it: SmallRye reads an
# empty value as ABSENT, the field is Optional<String>, and requireAdminPassword() already filters
# blank — so with neither variable set the behaviour is byte-identical to before, the same
# ResourceException naming the same key. What it adds is the one case that was broken: the old
# variable set, which is every deployment on this estate today.
qits.deployments.postgres.admin-password=${QITS_PLATFORM_DEPLOYMENTS_POSTGRES_ADMIN_PASSWORD:}

qits.deployments.postgres.admin-username=${QITS_PLATFORM_DEPLOYMENTS_POSTGRES_ADMIN_USERNAME:postgres}

# --- provisioning qits-idp service clients ---------------------------------------------------------
#
# What `resources: idp:client` asks for: a qits-idp SERVICE CLIENT for this deployment's own wire
# alias (PdNetworks.alias), created or rotated before its container starts — the idp analogue of the
# postgres role and database above. The idp's address is derived exactly like the postgres host
# (there is one idp per platform, so there is nothing to configure); the credential this component
# presents to it is its OWN, read where the adapter lives (service/idphost), because it is deployment
# config the same way the postgres admin password is.
#
# THE PATIENCE, the extras read's posture stated as two keys for this peer instead. The timeout
# bounds the connect and the read; the attempt count is spent one second apart, and a 2xx/4xx answer
# is never retried — a 409 or a 404 means the same thing on a second attempt. A service being
# redeployed is a few seconds of refusals and no deployment should die of one.
qits.deployments.idp-timeout-seconds=${QITS_PLATFORM_DEPLOYMENTS_IDP_TIMEOUT_SECONDS:5}
qits.deployments.idp-attempts=${QITS_PLATFORM_DEPLOYMENTS_IDP_ATTEMPTS:2}

# --- the transition network ----------------------------------------------------------------------
#
# Every container started here additionally joins this network. It exists because the platform still
# holds direct cross-application URLs (artifacts, events, observability, workspaces<->projects) that
# resolve on the flat qits-net and have not moved to gateway routes yet, and because it is what lets
# a compose-managed bootstrap hand containers over to per-application networks without a flag day.
#
# EMPTYING THIS KEY IS THE ENFORCEMENT FLIP, and it is a later phase: from then on an application is
# reachable only through its own network, its environment's hub, or a gateway route — and a URL
# nobody migrated fails loudly instead of resolving. Do it after the last direct URL is gone, not
# before. SmallRye reads an empty value as ABSENT, which is why the readers inject Optional<String>.
qits.deployments.legacy-network=${QITS_PLATFORM_DEPLOYMENTS_LEGACY_NETWORK:qits-net}

# --- extras: qits.deployments.extras.<application-name>.* --------------------------------
#
# A key family; no defaults shipped. ServiceExtras is the grammar, and the argued version of this:
#
#   ...extras.<application>.mounts[<i>]    = volume:<name>:<target>[:ro] | bind:<host-path>:<target>[:ro]
#   ...extras.<application>.publishes[<i>] = [<ip>:]<host-port>:<port>[/tcp|/udp]
#   ...extras.<application>.groups[<i>]    = <gid>
#   ...extras.<application>.env.<KEY>      = <value>
#
# What one application needs beyond its image, stated rather than spelled in an orchestrator's
# argv: the driver renders `--mount`, `--publish … mode=host`, `--group` and `--env`. It replaces
# qits.deployments.run-args.<application>, a free-form `docker run` argv — a deployment
# still carrying that key configures nothing.
#
# This is how a deployment gives a stateful application its datasource env and its /data volume,
# which the images refuse to boot without (their own Dockerfile headers explain why). Deployment
# config is the ONLY source: the environments API is deliberately open on the platform's networks
# and must never shape an argv (AGENTS.md). The DOTTED spelling is the only one read — an
# underscore cannot tell qits-ci's keys from qits-ci-daemon's. Absent (the shipped state): a
# container gets QITS_ENVIRONMENT and QITS_APPLICATION and nothing else.
#
# An unknown or malformed key REFUSES the deployment, with the key in its detail. A dropped flag
# would be a container that boots, passes its health gate and has lost its volume.

# WHERE THE EXTRAS ARE RE-READ FROM, ONCE PER ARGV. Quarkus reads a config directory's
# application.properties at boot and never again, so an edit on the deployment host's config volume
# was inert until the process was replaced — and every deployment re-stamped the boot snapshot onto
# the service it updated, reverting live `service update --env-add` fixes. Every argv build now
# layers a fresh read of this file over the boot config, one snapshot per deployment: edit the file,
# and the next deployment carries what it says.
#
# The path is relative to the process's working directory — /work on the deployment host, with the
# config volume mounted at /work/config — which is Quarkus' own config-dir convention, so this names
# the same file the boot config already read. Absent, the boot config alone answers, byte for byte
# what a dev run and the clone-alone suite always had. PRESENT AND UNREADABLE REFUSES THE
# DEPLOYMENT: a silent fall-back to boot values is the stale value this key exists to kill.
qits.deployments.extras-file=${QITS_PLATFORM_DEPLOYMENTS_EXTRAS_FILE:config/application.properties}

# THE SAME BRIDGE, AND WITHOUT IT THE SERVICE IS SILENTLY SWITCHED OFF. This key decides whether the
# deployer reads qits-configuration or the config volume's file, and after the namespace rename it
# was READ as qits.deployments.extras-url while every deployment still injects the old
# QITS_PLATFORM_DEPLOYMENTS_EXTRAS_URL — so it resolved to ABSENT, which is not an error but the
# documented "no service named" arm. The deployer would have gone on deploying from the BOOTSTRAP
# FILE, which predates the plane cutover and still names bare aliases, with nothing in any log
# saying the authoritative source had stopped being consulted.
#
# Empty stays empty on purpose: SmallRye reads an empty value as absent, which is exactly how a
# deployment turns the service back off, so the shipped behaviour with neither variable set is
# unchanged.
qits.deployments.extras-url=${QITS_PLATFORM_DEPLOYMENTS_EXTRAS_URL:}

# WHERE THE EXTRAS COME FROM WHEN A PLATFORM RUNS qits-configuration. UNSET SHIPPED, and unset is
# the file behaviour above byte for byte — no request is made and nothing here changes.
#
#   qits.deployments.extras-url=http://qits-configuration:8080
#   (env: QITS_PLATFORM_DEPLOYMENTS_EXTRAS_URL)
#
# ONE URL FOR THE WHOLE PLATFORM, and the example is the change: it used to name a per-tier host
# (http://dev-qits-configuration:8080), because a read addressed by the application alone could
# only tell one tier's configuration from another's by asking a different service. The tier is a
# PATH SEGMENT now, so there is one qits-configuration and it answers for every environment. Same
# key, same Optional semantics (SmallRye reads an empty value as absent, so a deployment turns the
# service back off by emptying the variable rather than by unsetting it).
#
# Set, that service is AUTHORITATIVE, and authoritative means SOLE — the config volume's file is
# not read at all. Every argv build reads
#   GET <extras-url>/configuration/api/applications/<app>/envs/<env>/resolved?version=<version>
# and the properties it answers with, over this process's boot config, are the whole snapshot. The
# version selects WHICH declaration the platform's overrides are resolved against, which is what
# makes deploying an older version give that version's configuration rather than the newest one's.
# The map is already in the full qits.deployments.extras.<app>.* spelling, so ServiceExtras
# stays its single parser.
#
# AN UNREACHABLE OR NON-200 SERVICE REFUSES THE DEPLOYMENT, naming the url. There is deliberately no
# fall-back to the file, to the boot config or to anything read earlier: a stale extras value is the
# failure this whole line of work exists to kill, and a fall-back would ship it as a green
# deployment. A 404 is not an answer here either, unlike the spec read's — an application
# qits-configuration has never heard of is one whose extras this deployment cannot know it is
# missing.
#
# THE SAME BASE IS WHERE A RELEASE'S DECLARATION IS SEEDED, in the other direction and one step
# earlier: before a deployment is scheduled, this component POSTs the repository's
# .config/qits/configuration.yml at the released tag to
#   POST <extras-url>/configuration/api/applications/<app>/declarations/<version>
# and refuses the deployment (DECLARATION_REFUSED) if the store will not take it. One url rather
# than a second key on purpose — two would let a platform seed one store and resolve against
# another, which is a deployment configured by a document nobody wrote.
#
# So UNSET MEANS THERE IS NO STORE: nothing is seeded, nothing is refused for the lack of it, and
# the extras are the config volume's file. That is the whole of what a file-mode platform does.
#
# The read is guarded. quarkus.oidc-client.qits.* in the deployable's own application.properties is
# the credential both the read and the seed present: on wherever the deployer runs, off under %dev
# and %test, where both carry the forward-auth headers alone.

# The patience, the spec read's posture stated as two keys. The timeout bounds the connect and the
# read; the attempt count is the WHOLE retry budget, spent one second apart. A service being
# redeployed is a few seconds of refusals and no deployment should die of one — while an outage
# that outlasts the budget must be a loud refusal rather than an unbounded wait on the deploy
# worker, which is single-threaded with every other event queued behind it.
#
# THEY BOUND THE SEED TOO, and no key of its own was added: it is the same peer over the same hop
# on the same worker, so a platform that had to state its patience twice would be one where the two
# could disagree. What the seed does NOT spend them on is a refusal — a 409 or a 422 is the store
# having READ the file, and a second POST of the same bytes answers the same thing.
qits.deployments.extras-timeout-seconds=${QITS_PLATFORM_DEPLOYMENTS_EXTRAS_TIMEOUT_SECONDS:5}
qits.deployments.extras-attempts=${QITS_PLATFORM_DEPLOYMENTS_EXTRAS_ATTEMPTS:2}

# --- the image-reference convention: <registry-host>/<image-repository>/<application>:<sha> ------
#
# registry-host is the OCI registry as resolvable BY THE DOCKER DAEMON, which is what performs the
# pull — not by this process. On the platform's networks that is the qits-platform-artifacts alias
# and its container port. Two things about that value are easy to get wrong in a deployment:
#   * the daemon must either trust it (insecure-registries) or reach it over TLS — a plain-HTTP
#     registry the daemon does not trust fails every pull with an https error;
#   * pulls there are anonymous today, so no docker login is needed to consume — see registry-auth
#     below for the flip.
#
# image-repository is the first path segment — the artifact_repository row (type oci-images) that
# must exist in qits-platform-artifacts before anything can push. `qits` is the platform's own;
# everything deployed is expected under it as <application-name>:<commit-sha>. Publishing that tag
# on a green build is the producer's half of the contract; a green build nothing published for is
# recorded here as IMAGE_MISSING rather than invented around.
#
# Both keys are named after their OWNER — qits-platform-artifacts' registry — because the spelling
# is shared with qits-ci, which ships the same two defaults and injects their values into every
# pipeline step container as QITS_REGISTRY / QITS_IMAGE_REPOSITORY, so a publish script names no
# deployment fact.
#
# THE DIALLER IS THE HOST'S DOCKER DAEMON, NOT A CONTAINER ON qits-net, which is why this default
# must never become a derived `<env>-qits-artifacts` alias: the daemon cannot resolve a qits-net
# name at all, qits-net or otherwise, so that spelling would break every pull rather than merely
# mis-point one. The bare `qits-platform-artifacts` this shipped for a while named a service that
# never existed on the platform's own DNS — a nowhere address masked only because every real
# deployment overrides the key with the edge vhost. What resolves FROM THE HOST is that same vhost,
# so the default is fixed to it directly rather than to any qits-net spelling.
qits.artifacts.registry-host=registry.${QITS_ENVIRONMENT:dev}.localhost:8080
qits.artifacts.image-repository=qits

# --- pulling from a registry that asks who you are --------------------------------------------
#
# Whether `docker service create` and `docker service update` carry --with-registry-auth. FALSE
# shipped, and then every argv is what it was byte for byte.
#
# The flag serialises the credential the CLI holds into the SERVICE SPEC, so the swarm agent
# authenticates the task's own pull. Without it only this component's warm-up `docker pull` is
# authenticated — that one runs as this process, with this process's DOCKER_CONFIG — and the pull
# the task performs on the node carries nothing and is refused.
#
# It is a key rather than always-on because reads on the platform's registry are anonymous today:
# there is nothing to serialise, and the flag would only put an empty auth block on every spec. The
# key is what lets this component ship ahead of the flip and be turned on by the deployment that
# mounts the credential, which is one restart rather than a release.
#
# THE MOUNTED CREDENTIAL IS ENV WIRING. The container runs as uid 1001 with no HOME, so the
# deployment sets DOCKER_CONFIG to a mounted path holding a config.json the bootstrap wrote. Nothing
# here reads or logs that file — the docker CLI does, and this key only says whether to pass what it
# found on to the agents.
qits.deployments.registry-auth=${QITS_PLATFORM_DEPLOYMENTS_REGISTRY_AUTH:false}

# --- the docker credential of this component's OWN idp client ---------------------------------
#
# Where DockerCredentialFile writes a config.json from QITS_RESOURCE_IDP_CLIENT_ID / _SECRET — the
# pair this container is started with once it declares idp:client for itself — and the directory
# PdProcess then hands every docker child as DOCKER_CONFIG, overriding the mounted one. Both halves
# do nothing while the pair is unset: no file is written, and with no config.json here a child keeps
# the container's own DOCKER_CONFIG, byte for byte what it always got. The same CLI process issues
# `service create/update --with-registry-auth`, so the credential swarm's agents pull with follows
# the same file.
#
# /tmp rather than the config volume: the file is derived from the environment at every boot, so it
# belongs to the container and must not outlive it on a volume a rolled-back predecessor mounts too.
qits.deployments.docker-config-dir=${QITS_PLATFORM_DEPLOYMENTS_DOCKER_CONFIG_DIR:/tmp/qits-docker}

# --- the health gate ------------------------------------------------------------------------------
#
# The gate is docker's own healthcheck, injected at `docker run` (--health-cmd curl'ing
# http://localhost:8080<path> inside the container) and polled via `docker inspect` — this process
# never joins an environment's network, so the probe has to run where the network already is. Two
# consequences the deployment owns: the image must carry curl (the platform's ubi-minimal images
# do), and the application must listen on 8080 (the platform's one exposed port, the same convention
# the gateway and compose files assume).
#
# default-health-path is the deploy-time LAST RESORT, not the convention. Registration derives
# /<name without the qits- prefix>/q/health/ready and writes it onto the service row, so this only
# reaches a row nothing has registered since. It is /q/health/ready because that is right for
# anything that does not mount itself under a segment.
#
# THE START PERIOD IS A MEASUREMENT, NOT A GUESS. It is the grace a boot gets before a failed probe
# starts counting against the retries, so at 10s the verdict was spent ~19s in — 10s of grace plus
# three retries at 3s — against applications that take far longer than that to open a listener.
# qits-projects is the one that was measured: three datasources with three migrate-at-start Flyway
# lineages, one of them allowing a 15s acquisition timeout, for a worst-case boot around 45s. On
# 2026-09-14 swarm rolled dev-qits-projects back while it was still migrating, and nothing was
# wrong with it. 60s is that 45s with room. It does not move alone — swarm's own --update-monitor
# below is the other half of the same window, and raising either by itself only changes which of
# the two binds.
#
# health-timeout-seconds is this component's OWN patience and nothing else's: it is the deadline
# `awaitConverged` is called with, the single place the key is read. It has to outlast everything
# swarm does before it answers — the start period, then the retries (interval * retries), then the
# rollback swarm executes itself — because a deadline that fires first turns swarm's verdict into
# this process's timeout and throws away the diagnosis. At a 60s start period 120 still held
# arithmetically and left nothing over; 180 is the same margin the old pair had.
qits.deployments.default-health-path=${QITS_PLATFORM_DEPLOYMENTS_DEFAULT_HEALTH_PATH:/q/health/ready}
qits.deployments.health-interval-seconds=${QITS_PLATFORM_DEPLOYMENTS_HEALTH_INTERVAL_SECONDS:3}
qits.deployments.health-retries=${QITS_PLATFORM_DEPLOYMENTS_HEALTH_RETRIES:3}
qits.deployments.health-start-period-seconds=${QITS_PLATFORM_DEPLOYMENTS_HEALTH_START_PERIOD_SECONDS:60}
qits.deployments.health-timeout-seconds=${QITS_PLATFORM_DEPLOYMENTS_HEALTH_TIMEOUT_SECONDS:180}

# --- the swarm topology ---------------------------------------------------------------------------
#
# THE TOPOLOGY COLLAPSES TO TWO OVERLAYS. Every `--network-add` recreates the task, so a
# hub-and-spoke of per-application networks joined after the fact would turn one deployment into a
# restart storm across the platform. So a service declares its whole membership when it is created:
# the flat overlay below, plus qits-platform for a platform service. Per-application isolation was
# nearly free with bridges and is not free here; buying it back later is swarm's own primitives'
# job, not a join.
#
# The flat network is the same qits-net every container is on today, as an ATTACHABLE overlay —
# attachable is what lets CI step containers, workspace containers and agent containers keep using
# `docker run` on it unchanged.
qits.deployments.swarm.flat-network=${QITS_PLATFORM_DEPLOYMENTS_SWARM_FLAT_NETWORK:qits-net}
#
# How long swarm watches a task after it starts before declaring the update good
# (--update-monitor). It is NOT the health gate's timeout ported: the gate window is
# --health-interval * --health-retries plus --health-start-period (the three keys above, which
# describe the probe) and this monitor on top. Measured on this host, an unhealthy task at
# `--health-interval 2s --health-retries 2` took ~22s to be declared failed — longer than the
# arithmetic suggests. 60s is what the 2026-09-14 rollback of dev-qits-projects measured: that
# application's worst case is a ~45s boot — three datasources, three migrate-at-start Flyway
# lineages, one of them allowing a 15s acquisition timeout — and a 30s monitor had already reached
# a verdict while the migrations were still running. It moves with the start period above, for the
# same reason that one names this one: they are two halves of one window, and raising either alone
# only changes which half binds.
#
# THESE VALUES STILL WANT MEASURING PER APPLICATION rather than deriving. 60 is one application's
# worst case made every application's floor — generous for a stateless frontend, and no promise at
# all for whatever boots slower than qits-projects next. There is no per-application knob today and
# building one is its own ticket; until then this number is the slowest thing on the platform, and
# it is raised by measuring, not by rounding up.
qits.deployments.swarm.update-monitor-seconds=${QITS_PLATFORM_DEPLOYMENTS_SWARM_UPDATE_MONITOR_SECONDS:60}

# How long a pull may take before it is recorded as a failed deployment — mostly a bound on cold
# image size over a slow link.
qits.deployments.pull-timeout-seconds=${QITS_PLATFORM_DEPLOYMENTS_PULL_TIMEOUT_SECONDS:600}

# Bounded tail kept of any docker output recorded onto a deployment (pull errors, log captures).
qits.deployments.output-max-chars=${QITS_PLATFORM_DEPLOYMENTS_OUTPUT_MAX_CHARS:65536}

# --- observing what the rows claim -----------------------------------------------------------------
#
# How often the LATEST deployment row per (application, tier) is read back against its container
# (DeploymentObserver). A pass is enqueued onto the deploy worker, so it never runs beside a cutover,
# and a tick that fires while the queue is busy collapses into the pass already pending.
#
# It exists because a status used to be written once and never re-read: row eaa34fbc ended FAILED
# because its post-gate bookkeeping ran on connections its own postgres cutover had killed, while the
# container it started stayed healthy for hours. The pass flips such a row back to ACTIVE, and demotes
# an ACTIVE row whose container is gone or terminally exited on two consecutive passes — patient in
# both directions, because restarting and running-but-unhealthy are the health gate's PENDING and not
# a death. It writes rows ONLY: no container is started, stopped or removed by it.
#
# 30s is well under a person's patience for the client's deployment list and far above the cost of one
# `docker inspect` per application. 0 switches the observer off entirely, and then a row's status is
# whatever the deployment that wrote it said — which is the behaviour every release before this one
# had.
qits.deployments.observe-interval-seconds=${QITS_PLATFORM_DEPLOYMENTS_OBSERVE_INTERVAL_SECONDS:30}

# --- re-driving what an earlier process accepted and never deployed ---------------------------------
#
# How often OwedReleaseSweep looks for obligations nobody is holding. It also runs ONCE AT STARTUP,
# which is the case it exists for: a `SoftwareRelease` is claimed in the event bus's ledger the moment
# this component's handler returns, and the handler returns as soon as the release is a runnable on
# the in-memory deploy worker queue — which is serialized platform-wide, is legitimately an hour deep,
# and is discarded by @PreDestroy. Every release in that queue at a cutover used to be lost silently:
# the successor's catch-up found the claim, skipped the event, and no deployment request was ever
# written. Seven applications went that way on 2026-09-05 between 13:00 and 17:15 UTC.
#
# THE TICK IS THE BELT AND THE BOOT PASS IS THE CURE. What the tick adds is the two cases a single
# boot pass cannot cover: a start that ran while this component's own postgres was still coming up,
# and an obligation this process took up and handed back after failing to discharge it. So the
# interval is the worst-case lateness of a re-drive within one process's life, never of a cutover
# recovery — that one is paid at boot.
#
# 60s rather than the observer's 30: a pass is a single indexed query that answers nothing on almost
# every tick, and the work it can produce lands on the same deploy worker the observer is queueing
# behind. 0 keeps the boot pass and switches the tick off.
qits.deployments.owed-release-sweep-seconds=${QITS_PLATFORM_DEPLOYMENTS_OWED_RELEASE_SWEEP_SECONDS:60}
