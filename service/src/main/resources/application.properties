# The application config for qits-platform-deployments as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# a context ships DEFAULTS it does not own the deployment of. The domain jars' own defaults (the
# datasource and Flyway lineage in `environments`, the execution keys in `deployments`) stay there;
# a deployment still overrides any of them by env.

quarkus.application.name=qits-deployments

# The prefix every route of this service lives under: /<segment>/api, where the segment is the
# APPLICATION name without the qits- prefix. The application is qits-deployments, so the segment is
# `deployments` — the same derivation every other service on the estate makes, and the same one
# DeployService.conventionHealthPath makes from a name. The edge routes VERBATIM by prefix —
# /deployments/* reaches this service with the path untouched — so the service itself has to serve
# /deployments/..., and there is no unprefixed form. This holds for service-to-service calls on the
# platform's networks too; they do not pass through the edge but they address the same paths.
#
# IT USED TO SAY /platform-deployments, AND THAT WORD IS RETIRED. The tier the qualifier named is
# deleted (see AGENTS.md, "The platform plane is DELETED"), the repository dropped it, and the
# application never carried it — only the route lagged, and it was closed on 2026-09-26. The old
# prefix was answered for exactly one release by api/LegacyPrefixReroute, which rewrote it onto this
# one and WARNed once per request; the last caller on that inventory was this service's own SPA, it
# was released with the new path, and the class is deleted. There is one spelling of the segment
# again and nothing answers the retired one.
#
# Without the key the intake moves to /events/software-released and qits-ci's notifier — which POSTs
# to a configured intake url and swallows delivery failures at debug — silently stops delivering.
# Nothing errors; deployments simply never happen. The suite inherits this file rather than keeping
# its own copy, so a test run cannot be green about a prefix that never ships.
quarkus.rest.path=/deployments/api

# Quarkus' non-application root — what the framework serves rather than application code. It sits
# OUTSIDE quarkus.rest.path, so it has to carry the segment on its own or it stays at /, which is
# the client's ground now and would answer the health gate with index.html. This is also what puts
# readiness at
# /deployments/q/health/ready — the path this component's OWN health gate curls when it deploys
# itself, and EXACTLY the one its health-path convention derives from the application name. So there
# is no `health_path:` override in .config/qits/deployments.yml any more and there must not be one:
# resolveHealthPath asks the spec, then the STORED pd_service.health_path row, then the convention,
# and all three name this path now — the stored row self-corrected once the route moved. A key
# restating the convention would only be a second place for this line to be edited out of step with.
quarkus.http.non-application-root-path=/deployments/q

# --- machine identity ---------------------------------------------------------------------------
# Two tracks of identity reach this service and they do not replace each other. A request with no
# Authorization header is USER traffic: qits-gateway performed the login and asserted X-Qits-User,
# and qits-auth-core's ForwardAuthMechanism reads it. A request WITH a bearer is MACHINE traffic:
# quarkus-oidc validates the token against qits-idp and qits-auth-core's MachineAuth
# decides what it covers.
#
# THE ROLLOUT GATE IS OFF (qits.auth.machine.required, defaulted false by qits-auth-core). Off,
# every MachineAuth.require* call returns at once and every guarded write behaves exactly as it
# would without the guard — network trust, no bearer needed. That is what lets this code deploy
# before qits-idp is minting anything at all. Turn it on per deployment with
# QITS_AUTH_MACHINE_REQUIRED=true once qits-idp is up and the senders send a bearer.
# MachineAuth then re-asks the audience question the token already passed at validation, against
# the platform's one audience it ships itself (qits-auth-core's qits.auth.machine.platform-audience,
# qits-platform) — so there is no audience key for a deployment to state here.
#
# Validation follows that gate rather than standing on its own, which is what lets this code deploy
# before qits-idp does: with the gate off there is no OIDC tenant, so nothing fetches a
# JWKS, nothing waits on a host named qits-idp, and a clone-alone `./mvnw verify` needs no
# issuer at all. There is no third state — either the gate and the validation are both on, or both
# off. Same shape in qits-ci and qits-platform-artifacts.
quarkus.oidc.tenant-enabled=${qits.auth.machine.required:false}

# Bearer-only: this service starts no login flow and holds no session — the gateway does both.
#
# THE ENVIRONMENT IS PART OF THE ADDRESS, AND THE SERVICE ALREADY KNOWS IT. The idp is an ordinary
# service in the one environment now, deployed as ${QITS_ENVIRONMENT}-qits-idp (it was
# qits-platform-idp until the platform tier went), and
# QITS_ENVIRONMENT is injected into every container by qits-deployments — so this derives the tier's
# idp rather than naming one, and no deployment has to state QUARKUS_OIDC_AUTH_SERVER_URL.
quarkus.oidc.auth-server-url=http://${QITS_ENVIRONMENT:dev}-qits-idp:8080/idp
quarkus.oidc.application-type=service

# Discovery OFF, path given. The issuer string is a public URL while the fetch happens internally on
# the platform's own networks, so a discovery document fetched from the issuer would name addresses
# this process cannot reach. The path is JOINED onto auth-server-url, so it is `jwks`, not
# `/idp/jwks`. Set quarkus.oidc.token.issuer as well the day the two diverge.
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=jwks

# A token minted for another service is not accepted here. There is ONE audience on this platform
# and every token carries it — a service's, a bootstrap's and a person's `qits` CLI token alike — so
# it is a literal rather than an expression over a per-service id: what a caller may do is decided
# by its roles, never by which service it was addressed to.
quarkus.oidc.token.audience=qits-platform

# AN UNREACHABLE IDP DOES NOT STOP THIS SERVICE. With the gate off there is no tenant to reach it
# with; with the gate on, the boot-time JWKS fetch fails to a WARN ("OIDC server is not available
# yet, an attempt to connect will be made during the first request") and startup continues. That
# matters more here than in most siblings: this is the service that would have to redeploy
# qits-idp.
#
# What that costs, and what this key buys back. "During the first request" is lazy tenant
# initialization, and the first request that carries a bearer is the one that pays for it: if the
# issuer is still unreachable THEN, the caller gets a 500 rather than a retry. On a cold boot every
# guarded service races idp's own start, and the loser answers 500 to a caller that will not try
# again — the announcement path swallows failures at debug, so the deployment simply never happens.
#
# connection-delay turns the single boot attempt into a retried one: 30S is fifteen tries, two
# seconds apart, which covers idp coming up beside this service in the same compose. It does NOT
# make idp a hard dependency — when the window expires the same WARN is logged and startup
# continues, so the sentence above still holds. Readiness deliberately stays independent of idp
# (quarkus.oidc.health.enabled is left off): tying this service's readiness to the issuer would put
# the thing that redeploys qits-idp behind qits-idp being up.
quarkus.oidc.connection-delay=30S
#
# And how fast a ROTATED idp key is picked up. The signing key is persisted in idp's database, so a
# redeploy — this service's own doing — keeps it; a rotation is an operator retiring a key, or an
# idp landing on an empty database. Until then this service holds the OLD key set, and an unknown
# `kid` buys ONE JWKS refresh. The default 10M is the minimum before the next, so that one attempt
# landing while idp is mid-cutover means ten minutes of 401s — again, for the service that would
# have to redeploy idp. PT5S ends it seconds after idp answers, at one fetch per five seconds.
quarkus.oidc.token.forced-jwk-refresh-interval=PT5S
#
# --- the credential this service PRESENTS -------------------------------------------------------
# ONE named client, `qits` (epic qits-540 dossier, 'Plan (as of 2026-09-13)', C4), carries this
# component's outbound bearer, and it has exactly one peer: qits-configuration, whose resolved read
# and declaration intake take a machine bearer. IdpExtrasBearer injects it; nothing else does.
# (HttpIdpClientProvisioner presents the same identity as a Basic pair, from the keys below.)
#
# IT IS ON wherever the deployer runs it — there is no switch to flip. Off under %dev and %test, so
# a suite or a local run never dials an idp; StoryProfile turns it on against a stub where a story
# needs a real token. Its old switch, QUARKUS_OIDC_CLIENT_CONFIGURATION_CLIENT_ENABLED, belonged to
# the client's old name and reaches nothing here any more. A token it cannot mint is not a boot
# failure: early acquisition is off, discovery is off, and IdpExtrasBearer turns a refused mint into
# an anonymous read that qits-configuration then answers for itself.
#
# THE ADDRESS IS DERIVED, like the tenant's above and like ResourceProvisioning's and
# HttpIdpClientProvisioner's: the idp's `<env>-qits-idp` alias on qits-net, unless the deployer
# injected QITS_RESOURCE_IDP_URL. The old QUARKUS_OIDC_CLIENT_CONFIGURATION_AUTH_SERVER_URL entry is
# deliberately NOT a fallback — it named the idp by hand, and the one address that is right is the
# one every other idp dial in this component already derives.
#
# THE AUDIENCE IS THE PLATFORM'S ONE, qits-platform — the plan's ruling: a receiver is addressed by
# the platform audience and by nothing else, and qits-idp puts it on every token whatever the client
# asked for. It is a literal for the reason quarkus.oidc.token.audience above is one.
#
# THE ID AND SECRET ARE NOT A CUTOVER (D9). This component does not declare idp:client for itself:
# it is the thing that provisions every other application's, so its own pair is the bootstrap's —
# since qits-163 a qits-idp row (`qits-deployments`) adopted from the secret the deployment carries.
# They read QITS_RESOURCE_IDP_* first, which a fresh bootstrap's seed stack hands this container,
# and fall back to QUARKUS_OIDC_CLIENT_CONFIGURATION_CLIENT_ID / _CREDENTIALS_SECRET, which is how
# the pair reaches the running deployment today. The raw env names are spelled inside ${…} on
# purpose (never the dotted key): a dotted reference would resolve through THAT property's own
# default chain — and `quarkus.oidc-client.configuration.*` is the neutralised stub below — rather
# than asking "did a deployment actually set this".
#
# THE DEFAULT (UNNAMED) CLIENT IS DISABLED AND STAYS DISABLED. The extension creates it whether or
# not anything injects it, and an enabled client with no auth-server-url fails the boot naming a key
# nobody meant to set.
quarkus.oidc-client.client-enabled=false
quarkus.oidc-client.qits.client-enabled=true
%dev.quarkus.oidc-client.qits.client-enabled=false
%test.quarkus.oidc-client.qits.client-enabled=false
quarkus.oidc-client.qits.auth-server-url=${QITS_RESOURCE_IDP_URL:http://${QITS_ENVIRONMENT:dev}-qits-idp:8080/idp}
# Discovery off and the path given, the same reasoning as the validation half above: the issuer
# string is a public URL while the fetch happens on the platform's own networks.
quarkus.oidc-client.qits.discovery-enabled=false
quarkus.oidc-client.qits.token-path=token
quarkus.oidc-client.qits.client-id=${QITS_RESOURCE_IDP_CLIENT_ID:${QUARKUS_OIDC_CLIENT_CONFIGURATION_CLIENT_ID:qits-deployments}}
quarkus.oidc-client.qits.credentials.secret=${QITS_RESOURCE_IDP_CLIENT_SECRET:${QUARKUS_OIDC_CLIENT_CONFIGURATION_CREDENTIALS_SECRET:}}
quarkus.oidc-client.qits.grant.type=client
quarkus.oidc-client.qits.grant-options.client.audience=qits-platform
# No token is fetched at boot. With an idp that is not up yet, an eager acquisition would fail the
# start of the service that would have to redeploy the idp — the same stance
# quarkus.oidc.connection-delay above takes for the validation half.
quarkus.oidc-client.qits.early-tokens-acquisition=false

# --- the client name the DEPLOYMENT still sets, neutralised ---------------------------------------
# `configuration` was this client's old name, and it is not a stub for a client nobody configures:
# the running container still carries QUARKUS_OIDC_CLIENT_CONFIGURATION_{CLIENT_ENABLED,CLIENT_ID,
# CREDENTIALS_SECRET,AUTH_SERVER_URL,GRANT_OPTIONS_CLIENT_AUDIENCE} (dev-qits-deployments' envKeys,
# 2026-10-02), and ONE such variable is enough to mint the map key — so a `configuration` client
# EXISTS at runtime whatever this file leaves out, and the live _CLIENT_ENABLED=true outranks the
# `false` here (ordinal 300 over 250). The two keys with no environment twin are what keep it inert:
# `discovery-enabled=false` stops runtime init dialling its issuer, and `token-path` stops a
# discovery-disabled client failing the boot outright. Nothing ever asks it for a token.
#
# Three of the five stay declared in .config/qits/configuration.yml because code still reads them
# by their raw env names: the id and secret (the `qits` client above, and the provisioner pair
# below) and the auth-server-url (BootResourceRegistration, recording this deployer's own idp row).
# These three lines go only once no QUARKUS_OIDC_CLIENT_CONFIGURATION_* variable reaches the
# container: the pair has to move off these names first, then the config GC deletes the retired
# entries and the deployer's extras file stops stating them (qits-375: a deleted entry still
# reaches the container while that file names it).
quarkus.oidc-client.configuration.client-enabled=false
quarkus.oidc-client.configuration.discovery-enabled=false
quarkus.oidc-client.configuration.token-path=token

# --- the pair HttpIdpClientProvisioner presents when THIS component provisions OTHER applications'
# idp:client resources --------------------------------------------------------------------------
# The same fallback chain as the `qits` client's id/secret pair above, and the same reason: this
# component's own idp identity is one pair, whichever family currently carries it. Read here rather
# than derived from the oidc-client because the adapter is a plain JDK HttpClient with its own
# Basic header, not a named oidc-client of its own — a second quarkus-oidc-client for one peer this
# component already has a credential for would be a second thing to keep in sync with the first.
#
# EXACTLY the `qits` client's chain, and no link of its own. It used to start with
# QITS_PLATFORM_DEPLOYMENTS_IDP_CLIENT_ID / _SECRET, which the oidc client never read: set nowhere
# (not in .config/qits/configuration.yml, not by the bootstrap, not in dev-qits-deployments' envKeys
# on 2026-10-03), but one stray entry would have split the pair — the Basic id here, the token's
# client there, and ResourceProvisioning's rotate guard (which reads this id as "who am I signed in
# as") refusing a client this process does not hold while allowing the one it does. Once this
# component declares idp:client for itself the injected QITS_RESOURCE_IDP_* pair has to win on all
# three, so the shadowing link is gone rather than left to lie in wait.
qits.deployments.idp.client-id=${QITS_RESOURCE_IDP_CLIENT_ID:${QUARKUS_OIDC_CLIENT_CONFIGURATION_CLIENT_ID:}}
qits.deployments.idp.client-secret=${QITS_RESOURCE_IDP_CLIENT_SECRET:${QUARKUS_OIDC_CLIENT_CONFIGURATION_CREDENTIALS_SECRET:}}

# --- how long a read is held through a database outage -------------------------------------------
# This component deploys the postgres its own catalogue lives in, so a cutover kills the connections
# of requests that are already in flight. PatientPgDriver (named by the environments jar) holds a
# request that has not opened a connection yet; this deadline covers the other half — a read whose
# connection died after statements ran, which is only safe to re-run because it is a read.
# PdReadPatience is where it is spent, and its javadoc says why the wrap sits at the REST layer
# rather than inside the catalogue.
#
# 15S: long enough for a container restart, short enough to stay under a client's own timeout, and
# deliberately NOT the deploy worker's 30s — the worker waits out an outage it caused itself and
# nothing is queued behind it, while this holds a request thread.
qits.deployments.db-retry-deadline=${QITS_PLATFORM_DEPLOYMENTS_DB_RETRY_DEADLINE:15S}

# --- how long ONE JDBC socket read may block -----------------------------------------------------
# THE ROOT-CAUSE HALF OF THE 2026-09-08 CURE, and the reason the key above was not enough. After
# this service's 00:10 self-deploy its eventstream-catchup-startup thread went into Agroal's
# borrow validation, down into PgConnection.isValid, and parked in a PostgreSQL socket read that
# never returned — a half-open TCP connection left by the blue-green cutover overlap. Narayana's
# reaper aborted the transaction at +60s and the thread did not move, because a reaper abort does
# not unpark a socket read. The catch-up sweep was serialized on a monitor, so that one parked
# thread stopped this component consuming events for six hours: every release of the window
# silently undeployed, every health check green, healed only by a restart.
#
# pgjdbc ships NO socket timeout, which is what made "forever" the honest description rather than an
# exaggeration. This is the cure the qits-eventstream jar deliberately does not ship — its own
# sweep-stall-budget comment names it — because a timeout on somebody else's datasource is the
# deployable's decision, and this is the deployable.
#
# 120 SECONDS, AND IT WAS SCANNED FOR RATHER THAN PICKED. What it must never be is shorter than a
# legitimate single read, so the query surface was read for the things that hold one open:
#   * NO pessimistic locking anywhere — no `select … for update`, no LockModeType.PESSIMISTIC_*, no
#     pg_advisory_lock. A postgres lock wait DOES hold a socket read, so this was the first thing
#     looked for and it is the one that would have argued for a large value. Mutual exclusion here
#     is in-JVM (the single-threaded deploy worker, ReleaseTips.claim's monitor,
#     ServiceCatalog.upsert's) or an idempotent unique-index insert (pd_owed_release's
#     uq_pd_owed_release_event, the eventstream ledger's on-conflict-do-nothing). Neither waits on a
#     holder — so the cutover overlap this incident happened inside, two instances of this component
#     alive at once, contends on nothing a row lock would queue behind.
#   * NO LISTEN/NOTIFY and nothing that parks on a connection waiting for work. The observation and
#     owed-release sweeps sleep off the database and open a transaction per pass; the bus long-polls
#     HTTP, never JDBC; and every docker call is deliberately outside a transaction.
#   * NOTHING analytics-shaped. The largest read on this surface is the pins endpoint's unindexed
#     `select … from pd_deployment order by seq desc` — one row per deployment attempt, never
#     pruned — which is hundreds of milliseconds at a million rows, not tens of seconds.
# So the honest floor is under a second and anything from ten seconds up is already far above
# everything real. The value is therefore chosen from the OTHER end, because THIS KEY IS BLUNT: it
# bounds Flyway's migrate-at-start on both lineages too, and V8's non-CONCURRENT index build and its
# `set not null` take ACCESS EXCLUSIVE on pd_deployment. A migration killed mid-flight is a failed
# boot. Being wrong short breaks a deployment that was working; being wrong long costs two minutes
# on a socket that is already dead, once.
#
# IT SITS BELOW THE WATCHDOG ON PURPOSE. qits.eventstream.sweep-stall-budget is PT5M, so the socket
# read dies at two minutes and the library's stall watchdog stays what it is meant to be — the
# backstop for a stall this cannot end — rather than the cure. Do not raise this past that budget.
#
# BOTH DATASOURCES, STATED HERE RATHER THAN HALF IN THE environments JAR beside its own three-line
# baseline: it is one decision about one process's sockets, and split it would be two places to
# change and two values to disagree. The unit is SECONDS (pgjdbc's), and it rides Agroal's
# additional-jdbc-properties rather than the JDBC url so the QITS_RESOURCE_*_URL contract a
# deployment supplies is untouched. PatientPgDriver passes both keys through — it strips only its
# own two patience properties.
quarkus.datasource.platformdeployments.jdbc.additional-jdbc-properties.socketTimeout=120
quarkus.datasource.eventstream.jdbc.additional-jdbc-properties.socketTimeout=120

# The second net, and it is a net rather than a second cure. tcpKeepAlive sets SO_KEEPALIVE, so the
# kernel probes a connection nobody is reading and a half-open one can be reaped before a borrow
# discovers it — which is exactly the state this incident's connection sat in while it waited in the
# pool. What it does NOT do is act quickly: the probe interval is the HOST's
# (net.ipv4.tcp_keepalive_time defaults to 7200s), so it is hours behind the timeout above and never
# substitutes for it. It is here because it costs nothing and because the failure was a dead peer
# rather than a slow one.
quarkus.datasource.platformdeployments.jdbc.additional-jdbc-properties.tcpKeepAlive=true
quarkus.datasource.eventstream.jdbc.additional-jdbc-properties.tcpKeepAlive=true

# --- the API document -------------------------------------------------------------------------
# Served at /deployments/q/openapi, with the browsable UI at
# /deployments/q/swagger-ui — both follow quarkus.http.non-application-root-path above, and
# `api-docs:` in .config/qits/deployments.yml names the second of those to the shell's viewer.
# always-include because swagger-ui is a dev-mode-only extension by default, and the point of
# packaging these as processes is that each documents its own surface in a real deployment.
#
# ONE OPERATION IS HIDDEN: the build-succeeded intake, a fire-and-forget wire contract nobody writes
# a client against. Everything else — the environments, the service catalogue, the applications, the
# deployments and the pins — is either driven by a person through the client or read by another
# first-party service against a pinned shape, which is what a published document is for.
quarkus.smallrye-openapi.info-title=qits-platform-deployments API
quarkus.swagger-ui.always-include=true

# --- the web UI ---------------------------------------------------------------------------------
# The Angular SPA in service/src/main/webui — the qits-spa-deployments submodule on its own main, not a
# vendored copy. Quinoa runs its npm build during augmentation and registers the output as static
# resources, so one process serves the UI and the API and the gateway needs no second upstream.
#
# TWO THINGS THIS ADDS TO A BUILD, both part of this repo's clone-alone rule:
#   - the submodule has to be checked out. `git clone` alone leaves src/main/webui empty and Quinoa
#     then finds no package.json ("No package.json found in Web UI directory"); an uninitialised
#     gitlink is an empty directory, which is the one case Quinoa treats as a misconfiguration
#     rather than as "no client". `git submodule update --init` is part of a fresh clone here.
#   - an npm and a node have to be on PATH. The Angular CLI at 21 wants node ^20.19 || ^22.12 || >=24;
#     the platform's pin is 22.22.0, and the mandrel builder image in docker/Dockerfile ships no node
#     at all — which is why the two package-manager-install flags exist THERE and nowhere else.
# Neither reaches `./mvnw test`: Quinoa is disabled in test mode by default, so the suite is green
# with an empty webui dir and no node at all. Anything that reaches `package` needs both, and
# `./mvnw verify` runs `package` on its way to failsafe.
#
# THE SPA IS SERVED AT THE ROOT. This service has a host of its own — deployments.<env>.<domain> —
# and the client owns every path on it that the wire routes below do not claim. Its baseHref is `/`,
# so the two sides agree by having nothing to agree about: no segment is spelled in the client.
#
# The segment survives in THREE keys that move together — the ignored prefix below,
# quarkus.rest.path and quarkus.http.non-application-root-path — plus `routes:` in
# .config/qits/deployments.yml, which is what tells the edge to path-route /deployments/* here from
# every vhost. FOUR spellings, all of them in this repository and all of them checkable by a build
# here. Four more existed for the length of the /platform-deployments cutover — a second ignored
# prefix, a second `routes:` entry, a `health_path:` override and api/LegacyPrefixReroute — and every
# one of them came out on 2026-09-26.
quarkus.quinoa.ui-root-path=/

# Deep links. Without this a GET /some/route is a 404 from the static handler rather than the SPA's
# own route — the client only ever sees its router if index.html is what comes back for a path the
# build produced no file for. It is what makes the project-scoped form, /qits, survive a reload.
quarkus.quinoa.enable-spa-routing=true

# Where Angular leaves the bundle, relative to the webui dir. `dist/<project>/browser` is the
# application builder's layout since Angular 17 (the browser/ level is where the SSR split put it).
# Quinoa's Angular detection can resolve this from the client's angular.json on its own; it is
# pinned anyway because the platform's style is to spell a value where its failure would land — the
# name in it is the SPA's package name, and a rename fails here loudly ("Quinoa build directory not
# found") instead of shipping an empty UI.
quarkus.quinoa.build-dir=dist/qits-spa-deployments/browser

# What SPA routing must NOT swallow. The re-route is a catch-all at /* registered near-last, so
# anything with a real route in front of it still wins — but a request matching NO route is rerouted
# to index.html and answers 200 text/html instead of 404. That is fine for a person, who gets the
# client's own not-found page, and wrong for a machine, which parses index.html as garbage data: the
# correct answer to a mistyped machine path is a 404. Every machine caller of this service dials it
# at its wire alias and never traverses the edge — qits-orchestrator's pin read, qits-artifacts'
# image collector, qits-projects' two hops — so nothing in front of this process is going to catch a
# path one of them got wrong.
#
# TWO ENTRIES, and both are ABSOLUTE. The values are matched after ui-root-path is stripped, and the
# ui-root is `/` now, so what is written here is the path as it arrives. Each is a PREFIX match, so
# `/deployments` covers both wire surfaces at once:
#
#   /deployments/api  JAX-RS (quarkus.rest.path)
#   /deployments/q    openapi, swagger-ui, health (non-application-root-path)
#
# Quinoa DERIVES this list when the key is unset, from those same two keys, and setting the key
# REPLACES the derivation rather than extending it — which is why the first entry has to cover both.
#
# THE SECOND ENTRY IS THE RETIRED PREFIX, AND IT IS PERMANENT. This service served
# /platform-deployments until 2026-09-26 and serves nothing there now; the entry is what makes a
# request under it a 404 instead of the client. It is NOT residue of the reroute that answered the
# old prefix for one release, and it does not come out with it — that is the mistake this line was
# already made once, and it was measured on the deployed 2026.926.170022: with the reroute deleted a
# legacy path is no longer rewritten, so it is simply a path matching no route, and Quinoa's
# catch-all handed it index.html at 200 text/html. Which is exactly the defect qits-380 was filed
# about — a wrong guess that reads as a working endpoint — recreated by tidying the line away.
#
# So the rule is not "the prefixes this service serves"; it is "the prefixes a machine may dial",
# and a retired one stays on that list while anything might still ask for it. Dropping it needs
# positive evidence that nothing does, which a log can no longer give now that the reroute's WARN is
# gone — so treat it as permanent rather than as a thing to sweep up later.
#
# THE TRAP THAT STAYS: websockets-next claims only the UPGRADE HANDSHAKE, so a socket path needs its
# own entry even though route ordering protects the upgrade. There is no socket here; one added
# outside /deployments joins this line in the same commit. Measured on qits-ci's daemon socket:
# before the prefix was ignored, a plain GET answered 200 index.html from a green build.
quarkus.quinoa.ignored-path-prefixes=/deployments,/platform-deployments

# quarkus.quinoa.package-manager-install is deliberately ABSENT and must stay absent. A local or CI
# `mvnw` build uses the node on PATH, so no build silently downloads a toolchain; the two install
# flags live in exactly one place, docker/Dockerfile's build stage, because the Mandrel builder image
# ships no node. A machine with no node fails at Quinoa's npm invocation — that is the intended
# failure, and the fix is node on PATH, not this key.

# --- what a deployment MUST override -----------------------------------------------------------
# Deliberately NOT pinned here, because any value this repo picks would be wrong and wrong quietly:
#
#   QUARKUS_DATASOURCE_PLATFORMDEPLOYMENTS_JDBC_URL
#                                    The image refuses to boot without it (the ${user.home} default
#                                    has nowhere to land under uid 1001 — the same
#                                    refuse-to-boot-unconfigured stance as the siblings). Point it
#                                    at the mounted volume:
#                                    jdbc:h2:file:/data/platformdeployments/h2/platformdeployments.
#
#   QITS_ARTIFACTS_REGISTRY_HOST     Where the DOCKER DAEMON pulls images from. The platform-network
#                                    default only resolves for a daemon whose containers sit on that
#                                    network; host-run docker wants the host-published address.
#
# There is no token of any kind to configure, and there never will be. Machine callers present a
# qits-idp bearer, which is a signed statement of identity rather than a shared string.
# What a deployment MAY set, once qits-idp is up and the senders are sending:
#
#   QITS_AUTH_MACHINE_REQUIRED=true    Turns enforcement on for this service's writes. Unset (the
#                                      shipped state) the intake and the environment writes keep
#                                      accepting credential-free calls, exactly as before. Set it
#                                      only after the senders are sending — a bearer nobody mints is
#                                      a 401 on every green build, and qits-ci swallows delivery
#                                      failures.
#
#   QUARKUS_OIDC_AUTH_SERVER_URL       Override when the idp is not at the default above.

# --- the packaged artifact -----------------------------------------------------------------------
# Name the build output `qits-platform-deployments` rather than
# qits-platform-deployments-service-<version>-runner, so `-Dnative` produces
# target/qits-platform-deployments and the process is identifiable in `ps` — which matters here
# because this service's own work is spawning docker children, and the process tree gets read while
# debugging a deployment. The name is spelled THREE times: here, as failsafe's native.image.path in
# service/pom.xml, and in docker/Dockerfile's COPY line. They move together — if they drift, the
# native IT launches nothing and passes.
quarkus.package.output-name=qits-platform-deployments
quarkus.package.jar.add-runner-suffix=false

# --- telemetry --------------------------------------------------------------------------------
# One key names the receiver: qits.observability.url — scheme, host and port, NO path. The ingest
# path is qits-observability's own and belongs to the service, not to the deployment, so it is
# spelled once here and derived rather than configured.
#
# qits-observability is an environment-tier application, not one of the nine platform services that
# stay bare, so the host carries the tier the same way every other derived address here does
# (BootResourceRegistration.ENVIRONMENT_VARIABLE). The bare form this shipped for a while
# (`qits-observability`) resolved nowhere on a platform with the plane deleted — this component's own
# QITS_ENVIRONMENT is what every other derivation reads, and telemetry is not a special case.
qits.observability.url=http://${QITS_ENVIRONMENT:dev}-qits-observability:8080

# http/protobuf, not the gRPC default: the receiver is OtelReceiverResource over HTTP, and the
# exporter appends /v1/<signal> to this base.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# Logs ride the same exporter; traces are on by default. The receiver decodes all three signals, and
# a log record correlated to a trace is most of why the receiver exists.
#
# THE THREE KEYS BELOW ARE SPELLED OUT ON PURPOSE. Quarkus still labels its OpenTelemetry logging
# integration PREVIEW, and the whole of what ships application logs to qits-observability is the
# handler this enables — so an upgrade that changed one of these defaults would stop the platform's
# logging with a green build and no error anywhere. Written down, a change of default is a diff
# rather than a silence. Measured against Quarkus 3.34.6's own config classes rather than recalled:
#
#   quarkus.otel.logs.handler.enabled  default true  (LogsRuntimeConfig.handlerEnabled)
#   quarkus.otel.logs.exporter         default cdi   (LogsBuildConfig.exporter)
#   quarkus.otel.logs.level            default ALL   (LogsRuntimeConfig.level)
#
# `cdi` is what routes the records at the exporter configured above rather than at a second,
# separately-configured one; `handler.enabled` is the JBoss Log Manager handler that turns an
# ordinary org.jboss.logging.Logger call into an OTLP record, and without it the other two keys
# describe a pipe nothing enters.
#
# The level is the ONE line here that is not the shipped default: Quarkus exports every record the
# log manager creates, and this makes INFO the outbound floor. Per-category quarkus.log levels still
# decide which records exist at all; this is a second gate on the way out, so that what leaves the
# process is a deliberate amount rather than whatever a debug category happens to emit. Console
# logging is untouched by all of it — the OTel handler is an ADDITIONAL copy, never the only one,
# which is what keeps a container's stdout the durable-at-host fallback when the receiver is down.
#
# That an ordinary logger call really becomes an exported OTLP record is proven once, in qits-events:
# its OtelLogBridgeTest decodes a real ExportLogsServiceRequest and PackagedLogBridgeIT repeats the
# claim against the packaged artifact. The same extension and the same four keys run here, so this
# repo guards the configuration rather than re-proving the behaviour — OtelLogConfigTest pins these
# values so drift cannot disable log export quietly.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO

# Metrics ride it too. Off by default in Quarkus, so without this line the third signal never
# leaves — the receiver has always decoded it, and the observability UI has nothing to plot until
# every service says this.
quarkus.otel.metrics.enabled=true

# Dark outside a deployment. A clone-alone `./mvnw verify` and a `quarkus:dev` have no
# qits-observability to reach, and an exporter retrying against an unresolvable host turns every
# suite into a wall of export failures. The deployment is where telemetry is real.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true

# --- the platform event bus -----------------------------------------------------------------
# The second door a green build reaches this component through. qits-ci publishes BuildSuccessful
# to qits-events; bus/PdBuildSuccessfulSubscriber consumes it durably and calls the same
# BuildAnnouncements.announce the HTTP intake calls. The machinery is the published
# qits-eventstream jar.
#
# NOTHING THE BUS NEEDS IS SPELLED HERE, deliberately. `qits.events.url`, the `eventstream`
# datasource and its Flyway lineage, the publish timeout, the retry budget, the redial backoff and
# the catch-up cadence all ship as defaults in that jar's META-INF/microprofile-config.properties
# at ordinal 100 — the same way the environments jar ships this component's own datasource — and a
# copy here would be a second place to change and a silent way for the two to drift. A deployment
# overrides them by environment: `QITS_EVENTS_URL`, and the resource triple
# QITS_RESOURCE_EVENTSTREAM_URL / _USERNAME / _PASSWORD that .config/qits/deployments.yml makes
# this component provision for its own successor.
#
# What DOES belong here is the darkness, because the library ships enabled — a library that shipped
# dark would be one whose first deployment discovers it was never wired up — and the deployable is
# what owns where it is real. Same policy and same reasoning as the OTel keys above: a clone-alone
# `./mvnw verify` and a `quarkus:dev` have no qits-events on the far side, and enabled, the
# subscriber would redial a stream nobody serves and the catch-up sweep would page a log nobody
# answers, once every thirty seconds, forever. Off means no stream is dialled, no sweep runs and
# the funnel touches no table — there is no half-enabled state.
#
# DARK IS NOT ABSENT: the `eventstream` datasource still opens and still migrates at boot, which is
# why the suite hands it a database of its own (testdb/EmbeddedPgConfigSource).
%dev.qits.eventstream.enabled=false
%test.qits.eventstream.enabled=false
