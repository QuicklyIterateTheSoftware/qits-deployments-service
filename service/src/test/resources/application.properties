# Test-only overrides. This module is the deployable, so its app-level settings live in
# src/main/resources/application.properties and Quarkus MERGES that file into the test config — it is
# not shadowed by this one. Never re-declare an app-level setting here: a test copy that drifts from
# the shipped copy makes the suite lie, passing on a value no deployment ever gets.
#
# What belongs here is only what a test run genuinely needs to be different: the port and the
# embedded database. The docker seam and the git host are not config at all — the suite installs
# FakeDeploymentDriver and FakeSpecSource (@Mock), so no @QuarkusTest reaches a docker CLI or the
# network. There is nothing else left to fake: the topology used to be a second service and needed a
# stub server on a real socket, and the merge retired it.
#
# The story ITs are the exception and they configure themselves: a LAUNCHED artifact carries the real
# SwarmDeploymentDriver and the real GitHostSpecSource, so stories/support/StoryProfile points the
# runtime key at a recording executable and the two urls at an in-JVM stub. None of that belongs
# here — it is a profile's business, and this file is read by every @QuarkusTest too.

# A FREE port, not Quarkus' default test port 8081. Two reasons, and the first is not theoretical:
#   - on the deployment host 8081 is the address the platform's own npm registry
#   (qits-platform-artifacts) is
#     published on — the address this repo's webui .npmrc names. So on the one machine this service
#     is most likely to be built on, the default test port is already bound and the whole suite dies
#     with "Port already bound: 8081: Address already in use", which reads like a code failure and
#     is not one.
#   - even where 8081 is free, @QuarkusTest restarts race each other for it.
# 0 lets the OS pick and RestAssured is told the real port. Failsafe already passes the same value
# to the packaged artifact (service/pom.xml), and the siblings carry this line verbatim. It is a
# test-only value, which is why it belongs here.
quarkus.http.test-port=0

# NO DEV SERVICES. This repo's first rule is that a clone builds and tests green with no docker, and
# a dev service is a container start: quarkus-oidc launches a real Keycloak whenever a profile leaves
# quarkus.oidc.auth-server-url unset (the gate-on suite does, to verify tokens against a local key),
# and an unnamed default datasource invites one of its own. Measured on the ancestors, not feared —
# before this line the gate-on suite pulled quay.io/keycloak/keycloak and testcontainers/ryuk and
# spent 22 seconds doing it. Nothing here needs a dev service: the one datasource is an embedded
# postgres the suite starts itself, and a datasource that already has a url invites none.
quarkus.devservices.enabled=false

# The suite runs against an EMBEDDED POSTGRES — real binaries, spawned as a child process by zonky,
# never a container. Its port is chosen at run time, so the url/username/password are not written
# here at all: EmbeddedPgConfigSource supplies them at an ordinal above this file. What is left here
# is what a file can say. clean-at-start wipes the schema between Quarkus restarts, which is what
# keeps a suite that shares one database across classes reproducible.
quarkus.hibernate-orm.platformdeployments.datasource=platformdeployments
quarkus.hibernate-orm.platformdeployments.packages=eu.wohlben.qits.deployments.environments.entity,eu.wohlben.qits.deployments.deployments.entity
quarkus.flyway.platformdeployments.migrate-at-start=true
quarkus.flyway.platformdeployments.clean-at-start=true
quarkus.flyway.platformdeployments.locations=classpath:db/platformdeployments/migration

# The SECOND lineage is the bus client's, and it needs a database even though the bus is dark in
# %test: `qits.eventstream.enabled=false` stops dialling, sweeping and claiming — not the
# datasource, which Quarkus opens and migrates at boot regardless. Its url, username and password
# come from EmbeddedPgConfigSource with the other three; the locations and the persistence-unit
# wiring are shipped in the qits-eventstream jar and are deliberately not copied here. Only the
# clean is test-only.
quarkus.flyway.eventstream.clean-at-start=true

# The postgres superuser the resource provisioner would authenticate as. It ships with NO default —
# no value this repository could pick would be right on a real platform — so a test run has to say
# something, and this is exactly the kind of thing that belongs here rather than in the shipped
# file. FakeResourceProvisioner never opens a socket, so the value is a placeholder and not a
# credential; MissingAdminPasswordProfile blanks it for the one test about its absence.
qits.deployments.postgres.admin-password=not-a-real-credential

# Who this deployer is "signed in as" — the id ResourceProvisioning's rotate guard refuses to rotate.
# A deployment always carries the pair (QITS_RESOURCE_IDP_* or the old QUARKUS_OIDC_CLIENT_* names)
# and the suite carries neither, so the shipped chain resolves to nothing here and the guard would
# fall back to its wider no-identity refusal. Stating one is what lets IdpClientProvisioningTest hold
# both halves: the own id refused, another client of qits-deployments rotated. It names the tier the
# self tests deploy into; FakeIdpClientProvisioner never presents it anywhere.
qits.deployments.idp.client-id=idp-self-qits-deployments

# THE USERFLOWS CLASS ORDERER, INSTALLED THE ONE WAY QUARKUS PERMITS. quarkus-junit ships its own
# junit-platform.properties with a ClassOrderer that groups tests by @TestProfile (so a profile's
# application is not torn down under a class still running), and surefire HARD-FAILS if a local
# junit-platform.properties overrides it. The blessed seam is the secondary orderer, which breaks
# ties INSIDE a profile group — story classes sharing a profile still run in topological
# @UserflowPrecondition order, and the ordinary test classes (no story annotations) are untouched.
# The framework's registries are per-JVM: keep the single sequential test JVM (surefire/failsafe
# default forkCount=1); do not enable parallel execution.
#
# It sits in this file rather than beside the story classes that need it because there is nowhere
# else to put it — this is the module's test config, and failsafe reads the same one. The order it
# produces is load-bearing: a cumulative capture source is attributed by a cursor, so the startup
# JWKS fetch belongs to whichever story drains first and stories.operations reads rows
# stories.deployment deployed. See AGENTS.md, "The userflow catalogue".
junit.quarkus.orderer.secondary-orderer=eu.wohlben.qits.userflows.UserflowClassOrderer

