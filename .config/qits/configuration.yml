# What qits-deployments declares about its own configuration.
#
# The deployer reads this file from the git host at the RELEASED TAG, beside
# `.config/qits/deployments.yml`, and POSTs it verbatim to qits-configuration before anything is
# scheduled:
#
#     POST /configuration/api/applications/qits-deployments/declarations/<version>
#          ?deploymentTarget=platform
#
# The store parses it with the estate's ONE strict parser (qits-configuration's `DeclarationParser`)
# and the resolved read a deployment makes — `?version=<version>` — resolves the stored entries over
# THIS document. Nothing on this side parses it: a second parser would be a second opinion about a
# grammar somebody else owns.
#
# WHY THIS REPOSITORY CARRIES ONE FIRST, and it is not vanity. The version-addressed read answers
# 404 for a version the store holds no declaration for, and the deployer seeds a declaration only
# for a release whose tag carries this file — so the release that ships the version-less fallback
# has to be deployable by the deployer that is still running WITHOUT it. With this file present the
# seed runs, the store holds a declaration for this version, and the version-addressed read finds
# one: the fix deploys itself past the defect it fixes.
#
# THE DOCUMENT IS CLOSED IN BOTH DIRECTIONS. `keys` is the whole top level; a key takes the
# attributes of its own type and nothing else; a type is one of string, boolean, number,
# serviceAddress, packageVersion. A malformed file is a DECLARATION_REFUSED release — recorded, and
# never deployed — so every line here is one the parser accepts.
#
# WHAT IS DELIBERATELY NOT HERE YET:
#   * DEFAULTS. Every key below declares its name and its type and no default, which is a complete
#     statement — the key exists, and until somebody sets it the resolved read simply does not carry
#     it. A default written here would be layered UNDER the stored entries and would therefore be
#     invisible on this platform, where the bootstrap sets all of them; writing one blind is how a
#     fresh install boots pointing at an address nobody meant.
#   * serviceAddress. `QITS_EVENTS_URL` and `QITS_OBSERVABILITY_URL` are the obvious candidates and
#     they are strings here on purpose: a serviceAddress is RENDERED by the platform and refuses a
#     stored value, so declaring one turns every hand-set address on the live platform into an
#     ignored row on the deployment that adopts it. That flip is the config-declarations epic's, one
#     application at a time, with the entries retired in the same step.
#
# WHY QITS_RESOURCE_DB_* IS ORPHANED ON PURPOSE, and it is a stronger claim than "redundant":
# ResourceProvisioning is the single authority for this component's own postgres credential on every
# self-deploy (see the repository's CLAUDE.md, "Resources: what the deployer provisions"), and its
# BootResourceRegistration reads the triple straight off the process's own environment at boot
# (BootResourceRegistration.java:339-344, `ConfigProvider.getConfig().getOptionalValue`) — so
# whatever the running container was actually started with is what gets recorded, not this store.
# That environment comes from the argv the swarm driver builds, and there the two sources collide in
# an order that makes the stored copy the DANGEROUS one rather than the harmless one: both
# SwarmDeploymentDriver.buildCreateArgv (`--env`, ResourceProvisioning's triple first, extras'
# `env.*` after) and buildUpdateArgv (`--env-add`, same order) write ResourceProvisioning's fresh
# triple BEFORE this service's stored extras, and the last `--env`/`--env-add` of one key wins — the
# ordering this file's own header comment for QITS_PLATFORM_DEPLOYMENTS_REGISTRY_AUTH already
# documents elsewhere as deliberate ("what config says outranks what this component defaults",
# SwarmDeploymentDriver.java:1475-1480). A stale stored QITS_RESOURCE_DB_PASSWORD would therefore
# silently OVERRIDE a freshly rotated one the moment ResourceProvisioning ever takes its reconcile
# arm (a database reset with the role intact — see "The registry row is the single authority for the
# credential" in the repository's CLAUDE.md), and the successor would boot unable to reach its own
# database. Declaring the key would not fix that — a declaration only says the key EXISTS, never
# what wins the argv — so the one change that removes the hazard is deleting the stored row once the
# orphan-delete UI ships, which is exactly what leaving it undeclared invites. QITS_RESOURCE_EVENTSTREAM_*
# carries no such row today: it is handed to the very first cold-boot container directly by the seed
# stack's own compose environment (never through `qits.deployments.extras.qits-deployments.*`,
# confirmed against ComposeTemplate.java), so qits-configuration's import never picked it up and there
# is nothing to flag either way.
#   * QUARKUS_OIDC_CLIENT_CONFIGURATION_{CLIENT_ENABLED,GRANT_OPTIONS_CLIENT_AUDIENCE} and
#     QITS_AUTH_MACHINE_AUDIENCE show as orphaned on purpose: nothing reads them. The outbound client
#     is `qits` now (epic qits-540 dossier, 'Plan (as of 2026-09-13)', C4) — on wherever the deployer
#     runs, its audience the literal qits-platform — and the inbound audience is qits-auth-core's own
#     shipped qits-platform. The other three keys under the old client name ARE declared below,
#     because code still reads them by their raw env names: this component keeps its bootstrap pair
#     (D9). application.properties neutralises the old client name while any of the five still
#     reaches the container.
#   * mounts[0] / mounts[1] / groups[0] are declared below, as `string`, exactly as the store already
#     spells them (`ConfigurationKeys.INDEXED_KEY`) — the config volume, the docker-socket bind, and
#     the socket's group id. Declaring them is what stops the coming orphan-delete UI from offering
#     to remove the very mount that makes this component able to drive an orchestrator at all.

keys:
  # --- this component's own namespace ---------------------------------------------------------

  mounts[0]:
    type: string
    description: "The config volume, mounted at /work/config, holding this component's DOCKER_CONFIG registry credential file."

  mounts[1]:
    type: string
    description: "The host's docker socket, bind-mounted so this component can drive the orchestrator that deploys every application on the platform, itself included."

  groups[0]:
    type: string
    description: "The docker socket's group id, added to the container so its own user can use the mounted socket."

  env.QITS_PLATFORM_DEPLOYMENTS_EXTRAS_URL:
    type: string
    description: "Where this deployer reads an application's extras from. Set, qits-configuration is authoritative and sole; emptied, the config volume's file is the source again."

  env.QITS_PLATFORM_DEPLOYMENTS_GIT_HOST_URL:
    type: string
    description: "Where a deployment spec and this declaration are read from, at the released tag."

  env.QITS_PLATFORM_DEPLOYMENTS_POSTGRES_ADMIN_PASSWORD:
    type: string
    description: "The postgres superuser password provisioning speaks DDL with. Never stored on a row, never in an argv, never logged."

  env.QITS_PLATFORM_DEPLOYMENTS_REGISTRY_AUTH:
    type: boolean
    description: "Whether the service create and update carry --with-registry-auth, so the swarm agent's own pull is authenticated too."

  # --- the platform's shared wiring -----------------------------------------------------------

  env.QITS_DOMAIN:
    type: string
    description: "The platform's domain, stated once for the whole installation. This component propagates it into every container it deploys, beside QITS_ENVIRONMENT, so that every service derives its own browser-facing names from it instead of carrying composed hostnames of its own."

  env.QITS_ARTIFACTS_REGISTRY_HOST:
    type: string
    description: "The registry host every image reference on this platform is qualified with."

  env.DOCKER_CONFIG:
    type: string
    description: "Where the docker CLI this component shells out to finds its config.json. The container runs as uid 1001 with no HOME."

  env.QITS_EVENTS_URL:
    type: string
    description: "The event bus this component subscribes to releases on and publishes its four deployment events to."

  env.QITS_OBSERVABILITY_URL:
    type: string
    description: "Where this application's OTLP telemetry goes."

  # --- the identity this surface is guarded by --------------------------------------------------

  env.QITS_AUTH_MACHINE_REQUIRED:
    type: boolean
    description: "The machine gate. Off there is no OIDC tenant at all; on, a machine token is validated and its audience re-asked at the write paths."

  env.QUARKUS_OIDC_AUTH_SERVER_URL:
    type: string
    description: "The issuer whose JWKS validates what arrives here."

  # --- this deployer's own idp identity, still spelled under the old client name --------------

  env.QUARKUS_OIDC_CLIENT_CONFIGURATION_AUTH_SERVER_URL:
    type: string
    description: "The idp address BootResourceRegistration records on this deployer's own idp row when QITS_RESOURCE_IDP_URL is unset; without it no row is recorded. The qits client itself derives <env>-qits-idp and does not read it."

  env.QUARKUS_OIDC_CLIENT_CONFIGURATION_CLIENT_ID:
    type: string
    description: "This deployer's own idp client id, read by the qits client, the idp provisioner and BootResourceRegistration when QITS_RESOURCE_IDP_CLIENT_ID is unset. Never a borrowed one: a refused read has to name the service that was refused."

  env.QUARKUS_OIDC_CLIENT_CONFIGURATION_CREDENTIALS_SECRET:
    type: string
    description: "A secret: this deployer's own idp client secret, read by the qits client, the idp provisioner and BootResourceRegistration when QITS_RESOURCE_IDP_CLIENT_SECRET is unset."
